name = "video-compress-gateway"
main = "src/index.mjs"
compatibility_date = "2026-10-01"

[vars]
GH_OWNER = "VNerTeam"        # điền: tên tài khoản chủ repo
GH_REPO = "vnerteam.github.io"                     # điền: tên repo
GH_BRANCH = "main"
WORKFLOW_FILE = "compress.yml"
TIMEZONE = "Asia/Ho_Chi_Minh"                   # múi giờ hiển thị giờ trong mục lục khi phải dựng lại từ release; nên trùng config/settings.json
ALLOWED_ORIGIN = "https://vnerteam.github.io"  # chỉ gồm scheme + host, không có đường dẫn

[[kv_namespaces]]
binding = "RATE"
id = "8901f23df29a4f6eb76f08616b8cac63"            # wrangler kv namespace create RATE
